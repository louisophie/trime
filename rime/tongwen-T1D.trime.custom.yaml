patch:
  __merge:
    style:
      keyboard_height: 260
      key_height: 44
      key_width: 10.0
      horizontal_gap: 1
      vertical_gap: 2
      candidate_view_height: 25
      key_text_size: 20
      label_text_size: 16
      round_corner: 8
      preview_height: 60
      preview_text_size: 40
      enter_labels:  # 定义Enter键的文本
        go: ⤷
        done: ☑
        next: ⏩
        pre:  ⏪
        search: 🔍︎
        send: ➤
    preset_keyboards:
      t1d:
        name: T1D
        author: "louisophie"
        ascii_mode: 1
        reset_ascii_mode: false
        keyboard_height: 271
        width: 14
        #height: 55
        horizontal_gap: 4
        vertical_gap: 4
        candidate_view_height: 28
        key_text_size: 18
        label_text_size: 16
        round_corner: 10
        lock: true
        keys:
          #https://www.madeintext.com/
          # Row 1: Navigation pad (HOME/END/arrows)
          - {  #Row 1-1
            label: "⇄", hint: "c", keep_label: true, click: "\t", width: 13, height: 40}
          - {  #Row 1-2
            label_symbol: "    🖼🔄", label: "$🩸  ", hint: '💾', keep_label: true, width: 14, 
            click: "{micro_duration}", swipe_left: "{Control+e}", swipe_right_up: "{Control+e}{reopen}{Return}", swipe_up: "{micro_photo}", swipe_down: "{Control+s}", 
            key_back_color: "#668fff"
            }
          - {  #Row 1-3
            label_symbol: "q  w  e", label: "a  s  d", hint: '\  z  x', keep_label: true, 
            key_text_size: 12, label_text_size: 12, 
            key_text_offset_x: 1, key_symbol_offset_x: -2, key_hint_offset_x: -1, width: 15, 
            key_back_color: "#be85e7", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF",
            swipe_left_up: "q", swipe_up: "w", swipe_right_up: "e", swipe_left: "a", click: 's', swipe_right: 'd', swipe_left_down: '\', swipe_down: "z", swipe_right_down: "x", long_click: " "}
          - {  #Row 1-4
            label_symbol: "r   t   y", label: "ⓕ g  h", hint: "c  v  b", keep_label: true, width: 15, 
            key_text_size: 12, label_text_size: 12, 
            key_text_offset_x: 1, key_symbol_offset_x: -2, 
            key_back_color: "#be85e7", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF",
            swipe_left_up: "r", swipe_up: "t", swipe_right_up: "y", swipe_left: "f", click: 'g', swipe_right: 'h', swipe_left_down: "c", swipe_down: "v", swipe_right_down: "b", long_click: " "}
          - {  #Row 1-5
            label_symbol: "u  i  o", label: "ⓙ k  l", hint: "n  m  , ", keep_label: true, width: 15, 
            key_text_size: 12, label_text_size: 12, 
            key_text_offset_x: 1, key_symbol_offset_x: -2, 
            key_back_color: "#be85e7", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF",
            swipe_left_up: "u", swipe_up: "i", swipe_right_up: "o", swipe_left: "j", click: "k", swipe_right: "l", 
            swipe_left_down: "n", swipe_down: "m", swipe_right_down: ",", long_click: " "}
          - {  #Row 1-6
            label_symbol: "p   {}    |", 
            label: "'  .  \" ", 
            hint: "[]   /   ?", 
            keep_label: true, 
            key_text_size: 12, label_text_size: 12, width: 15, 
            key_text_offset_x: 2, key_symbol_offset_x: -2, 
            key_back_color: "#be85e7", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF",
            swipe_left_up: "p", swipe_up: "{}{Left}", swipe_right_up: "|", 
            swipe_left: "'", click: '.', swipe_right: '"', 
            swipe_left_down: "[]{Left}", swipe_down: "/", swipe_right_down: "?", 
            long_click: " "}
          - {  # Row 1-7
            label: "⌦", label_symbol: "↺", hint: "↻", width: 13, keep_label: true, 
            click: Delete, swipe_up: "{Control+Shift+z}", swipe_down: "{Control+z}"}
          - {  # Row 2-1
              label: '↑️', keep_label: true, width: 13, click: Up}
          - {  # Row 2-2
            label: "B / B", label_symbol: "A      A", hint: "T      T", keep_label: true, width: 14, 
            click: "/", swipe_left_up: "<A", swipe_right_up: ">A", swipe_left: "<B", swipe_right: ">B", swipe_left_down: "<T", swipe_right_down: ">T", long_click: " "
            }
          - {  # Row 2-3
            label: 'ℋ𝟙𝒩 ', label_symbol: "　 ➊  1.\n\n(hypo)", hint: "①", keep_label: true, width: 15, 
            key_text_offset_y: -4, key_symbol_offset_y: 8,  key_hint_offset_y: 3,
            click: "1", swipe_up: "¹", swipe_down: "₁", swipe_left: "H", swipe_right: "N", long_click: "hypo", swipe_right_up: "1. ", 
            key_back_color: "#000000", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF"
            }
          - {  # Row 2-4
            label: 'ℛ 𝟚 ½', label_symbol: "　 ➋  2.\n\n(hyper)", hint: "②", keep_label: true, width: 15, 
            key_text_offset_y: -4, key_symbol_offset_y: 8,  key_hint_offset_y: 3,
            click: "2", swipe_up: "²", swipe_down: "₂", swipe_left: "R", swipe_right: "½", long_click: "hyper",  swipe_right_up: "2. ", 
            key_back_color: "#000000", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF"}
          - {  # Row 2-5
            label: 'ℐ𝟛𝒯 ', label_symbol: "　 ➌  3.\n\n(劑量)", hint: "③", keep_label: true, width: 15, 
            key_text_offset_y: -4, key_symbol_offset_y: 8,  key_hint_offset_y: 3,
            click: "3", swipe_up: "³", swipe_down: "₃", swipe_left: "I", swipe_right: "T", long_click: "劑量",  swipe_right_up: "3. ", 
            key_back_color: "#000000", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF"
            }
          - {  # Row 2-6
            label: '↓️️', label_symbol: ":", hint: '<!-- -->', keep_label: true, 
            click: Down, width: 15, swipe_down: "<!-- -->{Left}{Left}{Left}"
            }
          - {  # Row 2-7
            label: "✂️↓  ", label_symbol: "📑", hint: "📋", keep_label: true, width: 13, 
            key_text_offset_x: -6, 
            click: "Down", swipe_up: copy, swipe_down: paste, swipe_left: cut}
            # Row 3: Up | Left/内/(AC)/mg/dL | 4B⁴T₄ | 5鹽⁵內₅ | 6⁻⁶⁺₆ | Right/{}/↵ | End
          - {  # Row 3-1
            label: "⤆️", keep_label: true, width: 13, 
            key_text_size: 22, 
            click: Home
            }
          - {  # Row 3-2
            label: '内⇽内', label_symbol: "(AC)", hint: "mg/dL", keep_label: true, 
            key_text_size: 12, 
            click: Left, swipe_up: "(AC)", swipe_down: "mg/dL", swipe_left: "<内", swipe_right: ">内", long_click: ""
            }
          - {  # Row 3-3
            label: "B 𝟜 T", label_symbol: "　 ➍  4.\n\n(cf.)", hint: "    ④  C", keep_label: true, width: 15, 
            key_text_offset_y: -4, key_symbol_offset_y: 8,  key_hint_offset_y: 3,
            click: "4", swipe_up: "⁴", swipe_down: "₄", swipe_left: "B", swipe_right: "T", swipe_right_down: "C", long_click: 'cf.',  swipe_right_up: "4. ", 
            key_back_color: "#000000", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF"
            }
          - {  # Row 3-4
            label: "鹽𝟝內", label_symbol: "　 ➎  5.\n\n(ch.)", hint: "⑤", keep_label: true, width: 15, 
            key_text_offset_y: -4, key_symbol_offset_y: 8,  key_hint_offset_y: 3,
            click: "5", swipe_up: "⁵", swipe_down: "₅", swipe_left: "鹽", swipe_right: "內", long_click: "ch.", swipe_right_up: "5. ", 
            key_back_color: "#000000", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF"
            }
          - {  # Row 3-5
            label: "⁻ 𝟞 ⁺", label_symbol: "　 ➏  6.\n\n(不錯)", hint: "⑥", keep_label: true, width: 15, 
            key_text_offset_y: -4, key_symbol_offset_y: 8,  key_hint_offset_y: 3,
            click: "6", swipe_up: "⁶", swipe_down: "₆", swipe_left: "⁻", swipe_right: "⁺", long_click: "不錯", swipe_right_up: "6. ", 
            key_back_color: "#000000", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF"
            }
          - {  # Row 3-6
            label: '<⇾>', label_symbol: "-`{}`", hint: '\n', keep_label: true,  width: 15, 
            click: Right, swipe_up: t1d_dosage, swipe_down: "{End}{Right}{Return}{Up}", swipe_left: "<", swipe_right: ">"
            #click: Right, swipe_up: '{End}{Shift+Return}{End}{backtick}{leftbrace}', swipe_down: "{End}{Right}{Return}{Up}", swipe_left: "<", swipe_right: ">"
            }
          - {  # Row 3-7
            label: "⤇", label_symbol: "😌\n\n🤬", hint: '_ ', keep_label: true, width: 13, 
            key_text_size: 22, 
            key_text_offset_y: -4, key_symbol_offset_y: 8,  key_hint_offset_y: 1,
            click: End, long_click: "violent thing", swipe_down: "_", swipe_up: "mental issue"
            }
          - {  # Row 4-1
            label: "⇧", click: Shift_L, send_bindings: false, width: 13, keep_label: true, 
            key_text_size: 24
            }
          - {  # Row 4-2
            label: "I R T", label_symbol: "H\n\n(尚可)", hint: "N", keep_label: true, width: 14, 
            key_text_offset_y: -4, key_symbol_offset_y: 8,  key_hint_offset_y: 3,
            click: "R", swipe_up: "H", swipe_down: "N", swipe_left: "I", swipe_right: "T", long_click: "尚可"
            }
          - {  # Row 4-3
            label: "𝟟", label_symbol: "　 ➐  7.\n\n(不錯)", hint: "⑦", keep_label: true, width: 15, 
            key_text_offset_y: -4, key_symbol_offset_y: 8,  key_hint_offset_y: 3,
            click: "7", swipe_up: "⁷", swipe_down: "₇", long_click: "不錯", swipe_right_up: "7. ", 
            key_back_color: "#000000", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF"
            }
          - {  # Row 4-4
            label: "🈷️𝟠🕛", label_symbol: "　 ➑  8.\n\n(不穩定)", hint: "朙 ⑧ 倉", keep_label: true, width: 15,  key_text_offset_y: -3, key_symbol_offset_y: 8, key_hint_offset_y: 3, 
            click: "8", swipe_up: "⁸", swipe_down: "₈", swipe_left: "#### {date_d}{Return}", swipe_right: "{time_t} ", swipe_right_up: "8. ", swipe_left_down: luna_pinyin_ch, swipe_right_down: cangjie5_ch, long_click: "不穩定", 
             key_back_color: "#000000", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF"
            }
          - {  # Row 4-5
            label: "- 𝟡 +", label_symbol: "　 ➒  9.\n\n(穩定)", hint: "⑨", keep_label: true, width: 15, 
            key_text_offset_y: -4, key_symbol_offset_y: 8,  key_hint_offset_y: 3,
            click: "9", swipe_up: "⁹", swipe_down: "₉", swipe_left: "-", swipe_right: "+", long_click: "穩定", swipe_right_up: "9. ", 
            key_back_color: "#000000", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF"
            }
          - {  #Row 4-6
            label: "  𝟘 ⛶", label_symbol: "⓿", hint: "⓪", keep_label: true, width: 15, 
            click: "0", swipe_up: "⁰", swipe_down: "₀", swipe_right: "select_all", 
            key_back_color: "#000000", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF"}
          - {  # Row 4-7
            label: "⌫", click: BackSpace, swipe_left: Escape, width: 13, keep_label: true}
          - {  # Row 5-1
            label: "En", keep_label: true, width: 13, height: 30, click: spellless_en}
          - {  # Row 5-2
            label: "⌘", keep_label: true, click: liquid_keyboard_switch}
          - {  # Row 5-3
            label: "␣", label_symbol: "T1D", keep_label: true, width: 45, click: space, swipe_left: schema_prev, swipe_right: schema_next, long_click: Mode_switch}
          - {  # Row 5-4
            label: "123", keep_label: true, click: Keyboard_number, width: 15}
          - {  # Row 5-5
            label: "↲", keep_label: true, click: Return, composing: Return1, long_click: CommitComment, width: 13}
      t1d_eng:
        name: T1D_eng
        author: "louisophie"
        ascii_mode: 1
        reset_ascii_mode: false
        keyboard_height: 271
        width: 14
        #height: 55
        horizontal_gap: 4
        vertical_gap: 4
        candidate_view_height: 28
        key_text_size: 18
        label_text_size: 16
        round_corner: 10
        lock: true
        keys:
          #https://www.madeintext.com/
          # Row 1: Navigation pad (HOME/END/arrows)
          - {  #Row 1-1
            label: "⇄", hint: "eng", keep_label: true, click: "\t", width: 13, height: 40}
          - {  #Row 1-2
            click: ":", width: 14}
          - {  #Row 1-3
            label_symbol: "q  w  e", label: "a  s  d", hint: '\  z  x', keep_label: true, 
            key_text_size: 12, label_text_size: 12, 
            key_text_offset_x: 1, key_symbol_offset_x: -2, key_hint_offset_x: -1, width: 15, 
            key_back_color: "#e78d85", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF",
            swipe_left_up: "q", swipe_up: "w", swipe_right_up: "e", swipe_left: "a", click: 's', swipe_right: 'd', swipe_left_down: '\', swipe_down: "z", swipe_right_down: "x", long_click: " "}
          - {  #Row 1-4
            label_symbol: "r   t   y", label: "ⓕ g  h", hint: "c  v  b", keep_label: true, width: 15, 
            key_text_size: 12, label_text_size: 12, 
            key_text_offset_x: 1, key_symbol_offset_x: -2, 
            key_back_color: "#e78d85", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF",
            swipe_left_up: "r", swipe_up: "t", swipe_right_up: "y", swipe_left: "f", click: 'g', swipe_right: 'h', swipe_left_down: "c", swipe_down: "v", swipe_right_down: "b", long_click: " "}
          - {  #Row 1-5
            label_symbol: "u  i  o", label: "ⓙ k  l", hint: "n  m  , ", keep_label: true, width: 15, 
            key_text_size: 12, label_text_size: 12, 
            key_text_offset_x: 1, key_symbol_offset_x: -2, 
            key_back_color: "#e78d85", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF",
            swipe_left_up: "u", swipe_up: "i", swipe_right_up: "o", swipe_left: "j", click: "k", swipe_right: "l", 
            swipe_left_down: "n", swipe_down: "m", swipe_right_down: ",", long_click: " "}
          - {  #Row 1-6
            label_symbol: "p   {}    |", 
            label: "'  .  \" ", 
            hint: "[]   /   ?", 
            keep_label: true, 
            key_text_size: 12, label_text_size: 12, width: 15, 
            key_text_offset_x: 2, key_symbol_offset_x: -2, 
            key_back_color: "#e78d85", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF",
            swipe_left_up: "p", swipe_up: "{}{Left}", swipe_right_up: "|", 
            swipe_left: "'", click: '.', swipe_right: '"', 
            swipe_left_down: "[]{Left}", swipe_down: "/", swipe_right_down: "?", 
            long_click: " "}
          - {  # Row 1-7
            label: "⌦", label_symbol: "↺", hint: "↻", width: 13, keep_label: true, 
            click: Delete, swipe_up: "{Control+Shift+z}", swipe_down: "{Control+z}"}
          - {  # Row 2-1
              label: '↑️', keep_label: true, width: 13, click: Up}
          - {  # Row 2-2
            label: "B / B", label_symbol: "A      A", hint: "T      T", keep_label: true, width: 14, 
            click: "/", swipe_left_up: "<A", swipe_right_up: ">A", swipe_left: "<B", swipe_right: ">B", swipe_left_down: "<T", swipe_right_down: ">T", long_click: " "
            }
          - {  # Row 2-3
            label: 'ℋ𝟙𝒩 ', label_symbol: "➊\n\nhypo", hint: "①", keep_label: true, width: 15, 
            key_text_offset_y: -4, key_symbol_offset_y: 8,  key_hint_offset_y: 3,
            click: "1", swipe_up: "¹", swipe_down: "₁", swipe_left: "H", swipe_right: "N", long_click: "hypo", 
            key_back_color: "#000000", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF"
            }
          - {  # Row 2-4
            label: 'ℛ 𝟚 ½', label_symbol: "➋\n\nhyper", hint: "②", keep_label: true, width: 15, 
            key_text_offset_y: -4, key_symbol_offset_y: 8,  key_hint_offset_y: 3,
            click: "2", swipe_up: "²", swipe_down: "₂", swipe_left: "R", swipe_right: "½", long_click: "hyper", 
            key_back_color: "#000000", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF"}
          - {  # Row 2-5
            label: 'ℐ𝟛𝒯 ', label_symbol: "➌\n\n(unit)", hint: "③", keep_label: true, width: 15, 
            key_text_offset_y: -4, key_symbol_offset_y: 8,  key_hint_offset_y: 3,
            click: "3", swipe_up: "³", swipe_down: "₃", swipe_left: "I", swipe_right: "T", long_click: "unit", 
            key_back_color: "#000000", key_text_color: "#FFFFFF", key_symbol_color: "#FFFFFF"
            }
          - {  # Row 2-6
            label: '↓️️', hint: '<!-- -->', keep_label: true, 
            click: Down, width: 15, swipe_down: "<!-- -->{Left}{Left}{Left}"
            }
          - {  # Row 2-7
            label: "✂️↓  ", label_symbol: "📑", hint: "📋", keep_label: true, width: 13, 
            key_text_offset_x: -6, 
            click: "Down", swipe_up: copy, swipe_down: paste, swipe_left: cut}
            # Row 3: Up | Left/内/(AC)/mg/dL | 4B⁴T₄ | 5鹽⁵內₅ | 6⁻⁶⁺₆ | Right/{}/↵ | End
          - {  # Row 3-1
